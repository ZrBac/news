# Compatibility for already-open pages using the former server API URL.
# New Pages builds call the Worker directly and do not depend on this proxy.
location ^~ /api/news-refresh {
    limit_req zone=news_refresh_limit burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 128;
    proxy_pass https://news-refresh.944052796.workers.dev;
    proxy_set_header Host news-refresh.944052796.workers.dev;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_ssl_server_name on;
    proxy_ssl_name news-refresh.944052796.workers.dev;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
}
