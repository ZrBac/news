<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <script>
      if (
        location.protocol === "http:" &&
        location.hostname === "news.zacai.fun"
      ) {
        location.replace(
          "https://news.zacai.fun" +
            location.pathname +
            location.search +
            location.hash,
        );
      }
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        const theme =
          localStorage.getItem("zrbac-news-theme") === "dark"
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#181818" : "#ffffff";
        const size = JSON.parse(
          localStorage.getItem("zrbac-reading-preferences-v1") || "{}",
        )?.size;
        if (["large", "larger"].includes(size))
          document.documentElement.dataset.readingSize = size;
      } catch {}
    </script>
    <meta
      name="news-refresh-endpoint"
      content="https://zacai.fun/api/news-refresh"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="资讯" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/news/icon-180.png" />
    <meta
      name="description"
      content="综合新闻、人工智能和科技动态，按发布时间更新，附来源与原文链接。"
    />
    <meta property="og:title" content="资讯 · 综合与科技" />
    <meta property="og:description" content="综合新闻、AI 与科技资讯。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://news.zacai.fun/" />
    <link rel="canonical" href="https://news.zacai.fun/" />
    <link rel="icon" type="image/svg+xml" href="/assets/news/favicon.svg" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="资讯 RSS"
      href="/news.xml"
    />
    <link rel="stylesheet" href="/assets/news/style.css" />
    <title>资讯 · 综合热点与 AI 科技资讯</title>
    <link rel="stylesheet" href="/assets/news/compat.css" />
    <script src="/assets/news/compat.js" defer></script>
    <script src="/assets/news/personal.js" defer></script>
    <script src="/assets/news/archive.js" defer></script>
    <script src="/assets/news/exchange-core.js" defer></script>
    <script src="/assets/news/app.js" defer></script>
    <script src="/assets/news/pwa.js" defer></script>
  </head>
  <body>
    <a href="#section-title" class="skip-link">跳到资讯列表</a>
    <header class="header">
      <div class="header-inner">
        <a class="brand" href="#all" aria-label="资讯首页"
          ><span class="brand-name">资讯</span></a
        >
        <div class="header-actions">
          <a href="/guide/" class="games-link guide-link">生活指南</a>
          <a href="/games/" class="games-link">小游戏</a>
          <button
            id="theme-toggle"
            class="icon-button"
            aria-label="切换深色模式"
            title="切换主题"
          >
            <span data-icon="moon"></span>
          </button>
          <a href="#saved" class="saved-link" data-view="saved"
            ><span data-icon="bookmark"></span><span>我的收藏</span
            ><b id="saved-count" hidden>0</b></a
          >
        </div>
      </div>
    </header>

    <main class="page">
      <div class="update-bar">
        <span id="edition-date">资讯更新</span>
        <div class="connection-status">
          <span id="update-status" role="status">正在加载…</span
          ><span id="load-notice" role="status" hidden></span>
        </div>
        <button id="refresh-news" title="请求抓取并发布最新新闻">
          刷新资讯
        </button>
        <button id="sources-trigger">来源状态</button>
      </div>

      <div class="main-layout">
        <section
          id="news-content"
          class="news-section"
          aria-labelledby="section-title"
        >
          <div class="section-heading">
            <div>
              <h1 id="section-title" tabindex="-1">每日速览</h1>
            </div>
            <span id="result-count" class="result-count"></span>
          </div>
          <div class="filter-tabs" aria-label="资讯栏目">
            <div
              class="filter-group filter-views"
              role="group"
              aria-label="阅读方式"
            >
              <a
                href="#brief"
                data-view="brief"
                class="active"
                aria-current="page"
                >每日速览</a
              >
              <button data-filter="all" aria-pressed="false">全部</button>
            </div>
            <div
              class="filter-group filter-categories"
              role="group"
              aria-label="新闻分类"
            >
              <button data-filter="general" aria-pressed="false">综合</button>
              <button data-filter="tech" aria-pressed="false">科技</button>
              <button data-filter="ai" aria-pressed="false">AI</button>
              <button data-filter="models" aria-pressed="false">模型</button>
              <button data-filter="entertainment" aria-pressed="false">
                文娱
              </button>
              <button data-filter="gaming" aria-pressed="false">游戏</button>
              <button data-filter="sports" aria-pressed="false">体育</button>
            </div>
            <div
              class="filter-group filter-tools"
              role="group"
              aria-label="数据与工具"
            >
              <button data-filter="exchange" aria-pressed="false">汇率</button>
              <button data-filter="housing" aria-pressed="false">
                杭州房价
              </button>
            </div>
          </div>
          <div class="filter-row">
            <label class="search-box"
              ><span data-icon="search"></span
              ><input
                id="search"
                type="search"
                placeholder="搜索标题、关键词…"
                aria-label="搜索资讯标题和摘要"
              /><kbd>/</kbd></label
            >
            <label class="source-select"
              ><span class="sr-only">按资讯源筛选</span
              ><select id="source-filter">
                <option value="all">全部来源</option>
              </select></label
            >
            <button
              id="date-trigger"
              class="date-button"
              aria-expanded="false"
              aria-controls="date-panel"
            >
              <span data-icon="calendar"></span><span>日期</span>
            </button>
          </div>
          <div id="date-panel" class="date-panel">
            <label for="date-filter">按发布日期查看（北京时间）</label
            ><input type="date" id="date-filter" /><button
              id="clear-date"
              class="text-button"
            >
              查看全部日期
            </button>
          </div>
          <details class="reading-options">
            <summary>阅读设置</summary>
            <div class="reading-controls">
              <label
                >字号
                <select id="reading-size">
                  <option value="normal">标准</option>
                  <option value="large">较大</option>
                  <option value="larger">大号</option>
                </select></label
              >
              <label><input id="only-unread" type="checkbox" /> 只看未读</label>
              <button id="export-bookmarks" class="text-button">
                导出收藏
              </button>
              <button id="import-bookmarks" class="text-button">
                导入收藏
              </button>
              <input
                id="bookmarks-file"
                type="file"
                accept="application/json,.json"
                hidden
              />
            </div>
            <p id="reading-status" class="reading-status" role="status"></p>
          </details>
          <p id="view-note" class="view-note">
            按不同分类和来源选取当天最多10条消息，可切换日期回看。
          </p>
          <p id="refresh-notice" class="view-note" role="status" hidden></p>
          <p id="pwa-update" class="pwa-update" role="status" hidden>
            网站有新版本。<button id="apply-update" class="text-button">
              更新页面
            </button>
          </p>
          <section
            id="exchange-rates"
            aria-label="外币兑人民币汇率"
            hidden
          ></section>
          <section id="housing-prices" aria-label="杭州房价" hidden></section>
          <div
            id="articles"
            class="article-list"
            aria-live="polite"
            aria-busy="true"
          >
            <p class="sr-only">正在加载资讯…</p>
            __NEWS_SKELETON__
          </div>
          <button id="load-more" class="load-more" hidden>
            加载更多 <span data-icon="arrow-down"></span>
          </button>
          <p id="archive-notice" class="view-note" role="status" hidden></p>
          <p id="list-end" class="list-end" hidden>已显示全部结果。</p>
        </section>

        <aside class="sidebar">
          <section class="radar-card">
            <div class="sidebar-heading">
              <h2>各站最新</h2>
              <span>每站一条</span>
            </div>
            <ol id="latest-list">
              <li class="sidebar-placeholder">正在获取最新资讯…</li>
            </ol>
          </section>
          <section class="sidebar-section">
            <div class="sidebar-heading">
              <h2>AI 动态</h2>
              <a href="#ai">更多</a>
            </div>
            <ol id="tech-list" class="side-list"></ol>
          </section>
          <section class="source-card">
            <div class="sidebar-heading"><h2>订阅来源</h2></div>
            <div id="source-badges" class="source-badges"></div>
            <button id="about-trigger" class="text-button">关于本站</button>
          </section>
        </aside>
      </div>
    </main>
    <footer class="footer">
      <span class="copyright">© <span id="year">2026</span> ZrBac</span>
      <div class="footer-links">
        <a href="/news.xml">RSS</a>
        <button id="footer-sources">资讯来源</button>
        <button id="install-app">安装到桌面</button>
        <a
          href="https://github.com/ZrBac/news"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </div>
    </footer>
    <dialog id="info-dialog" aria-labelledby="dialog-title">
      <div class="dialog-heading">
        <h2 id="dialog-title">资讯来源</h2>
        <button id="close-dialog" class="icon-button" aria-label="关闭窗口">
          <span data-icon="x"></span>
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript
      ><div class="noscript">
        资讯列表需要 JavaScript。你也可以阅读
        <a href="/news.xml">RSS 资讯订阅</a>。
      </div></noscript
    >
  </body>
</html>
