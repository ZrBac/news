name: Check news cloud worker
on:
  push:
    branches: [hexo]
    paths:
      [
        "ops/cloudflare/**",
        "news/assets/guide-core.js",
        ".github/workflows/news-worker-check.yml",
      ]
  pull_request:
    paths:
      [
        "ops/cloudflare/**",
        "news/assets/guide-core.js",
        ".github/workflows/news-worker-check.yml",
      ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ops/cloudflare
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ops/cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
